<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>动物棋</title>
    <link rel="stylesheet" href="styles.css" />
</head>
<body>
    <div class="app">
        <header class="app-controls">
            <div class="brand-row">
                <div>
                    <h1>动物棋</h1>
                    <p class="brand-sub">翻开 · 对峙 · 以弱胜强</p>
                </div>
                <div class="top-actions">
                    <button type="button" id="btnMute" class="ghost icon-btn" title="静音开关" aria-label="静音开关">🔊</button>
                    <button type="button" id="btnToggleRooms" class="ghost">房间</button>
                </div>
            </div>
            <div class="controls-row">
                <div class="panel inline">
                    <label>用户名：<input id="username" type="text" placeholder="请输入用户名" autocomplete="nickname" /></label>
                </div>
                <div class="panel inline">
                    <button id="btnQuickJoin" type="button">快速加入</button>
                    <button id="btnFlip" type="button" class="ghost">翻牌说明</button>
                </div>
                <div class="panel inline">
                    <label>房间ID：<input id="gameIdInput" type="text" placeholder="输入房间ID加入" /></label>
                    <button id="btnJoin" type="button">加入房间</button>
                </div>
            </div>
            <div class="panel" id="roomPanel">
                <div class="room-head">
                    <strong>房间列表</strong>
                    <button id="btnRefreshRooms" type="button" class="ghost">刷新</button>
                </div>
                <div class="room-body">
                    <div id="roomList"></div>
                </div>
            </div>
            <div class="status-bar">
                <span id="status">未连接</span>
                <button id="btnLeave" type="button" class="ghost">退出房间</button>
            </div>
        </header>
        <main class="board-stage">
            <div class="board-frame">
                <div id="board" aria-label="棋盘"></div>
                <div class="captured-panel">
                    <div class="captured-group">
                        <div>红方被吃</div>
                        <div id="capturedRed" class="captured-icons"><span class="empty">无</span></div>
                    </div>
                    <div class="captured-group">
                        <div>黑方被吃</div>
                        <div id="capturedBlack" class="captured-icons"><span class="empty">无</span></div>
                    </div>
                </div>
            </div>
        </main>
    </div>
    <div id="pieceGhost" aria-hidden="true"></div>
    <div id="tip" role="status"></div>
    <div id="resultBanner" aria-live="polite"><div class="banner-card"></div></div>

    <script src="audio.js"></script>
    <script src="main.js"></script>
</body>
</html>
