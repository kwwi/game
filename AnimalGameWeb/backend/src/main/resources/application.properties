# 服务启动时创建的房间数量，默认 10
room.count=10

# DeepSeek 人机对弈（也可用环境变量 DEEPSEEK_API_KEY）
deepseek.api-key=${DEEPSEEK_API_KEY:}
deepseek.base-url=https://api.deepseek.com
deepseek.model=deepseek-chat
deepseek.timeout-ms=12000
# true：控制台打印完整 prompt / 原始回复 / 所选动作
deepseek.log-detail=false
# true：要求模型返回 reason，并在 Web 页面展示推理过程与结果
deepseek.show-reasoning=true
